name: DevSecOps Compliance Check (manual only)

on:
  workflow_dispatch:

jobs:
  compliance-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build API Container
      run: docker build -t compliance-api .

    - name: Note
      run: echo "Auto-remediation removed from CI. Scanning and approvals now happen through the running API's /api/scan and /api/approve endpoints, with a human reviewing before anything is applied."
